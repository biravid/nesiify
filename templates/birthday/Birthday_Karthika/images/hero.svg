<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="40%" stop-color="#6441a5"/>
      <stop offset="70%" stop-color="#fe6b8b"/>
      <stop offset="100%" stop-color="#ff8e53"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffb199" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fe6b8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Glowing Sun / Atmosphere -->
  <circle cx="600" cy="450" r="350" fill="url(#sunGlow)"/>

  <!-- Twinkling Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="150" cy="120" r="2.5"/>
    <circle cx="280" cy="80" r="1.5"/>
    <circle cx="420" cy="160" r="2"/>
    <circle cx="750" cy="90" r="3"/>
    <circle cx="920" cy="140" r="2"/>
    <circle cx="1050" cy="70" r="2.5"/>
    <circle cx="80" cy="250" r="1.5"/>
    <circle cx="1120" cy="220" r="2"/>
  </g>

  <!-- Floating Sparkles & Hearts -->
  <g filter="url(#glow)">
    <path d="M 600,220 C 600,220 570,180 530,200 C 490,220 500,270 600,340 C 700,270 710,220 670,200 C 630,180 600,220 600,220 Z" fill="url(#heartGrad)" opacity="0.85" transform="translate(0, -30) scale(0.6) translate(400, 50)"/>
    <path d="M 600,220 C 600,220 570,180 530,200 C 490,220 500,270 600,340 C 700,270 710,220 670,200 C 630,180 600,220 600,220 Z" fill="url(#heartGrad)" opacity="0.6" transform="translate(-200, 100) scale(0.4)"/>
    <path d="M 600,220 C 600,220 570,180 530,200 C 490,220 500,270 600,340 C 700,270 710,220 670,200 C 630,180 600,220 600,220 Z" fill="url(#heartGrad)" opacity="0.75" transform="translate(300, 120) scale(0.45)"/>
  </g>

  <!-- Mountain Silhouettes -->
  <path d="M 0,600 Q 350,480 600,550 T 1200,520 L 1200,800 L 0,800 Z" fill="#1b032b" opacity="0.7"/>
  <path d="M 0,640 Q 250,560 600,600 T 1200,580 L 1200,800 L 0,800 Z" fill="#10011a"/>

  <!-- Couple Silhouette on Hill -->
  <g fill="#07000d">
    <!-- Hill -->
    <path d="M 350,800 Q 600,660 850,800 Z"/>
    <!-- Couple Holding Hands silhouette -->
    <!-- Person 1 -->
    <circle cx="560" cy="620" r="16"/>
    <path d="M 545,638 Q 560,635 575,638 L 570,710 L 550,710 Z"/>
    <!-- Person 2 -->
    <circle cx="640" cy="625" r="15"/>
    <path d="M 625,640 Q 640,637 655,640 L 650,710 L 630,710 Z"/>
    <!-- Holding Hands Heart Gesture -->
    <path d="M 570,660 Q 600,650 630,660" stroke="#07000d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Glowing Heart Between Them -->
  <path d="M 600,625 C 600,625 590,605 575,615 C 560,625 565,640 600,665 C 635,640 640,625 625,615 C 610,605 600,625 600,625 Z" fill="#ff4b2b" filter="url(#glow)" transform="translate(0, -35) scale(0.6) translate(400, 250)"/>

  <!-- Title Badge Overlay in SVG for aesthetics -->
  <rect x="250" y="240" width="700" height="180" rx="30" fill="rgba(255,255,255,0.08)" backdrop-filter="blur(10px)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="600" y="310" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Our Journey of Unconditional Love</text>
  <text x="600" y="360" font-family="'Dancing Script', cursive, sans-serif" font-size="30" fill="#ffd700" text-anchor="middle">Happy Anniversary</text>
</svg>
